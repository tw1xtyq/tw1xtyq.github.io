<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1742"/>
      <stop offset="1" stop-color="#070915"/>
    </linearGradient>
    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="220" y1="0" x2="800" y2="0">
      <stop offset="0" stop-color="#9a86ff"/>
      <stop offset="1" stop-color="#3cd2f7"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6f5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6f5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32.5" y="32.5" width="959" height="959" rx="223.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <circle cx="512" cy="512" r="400" fill="url(#halo)"/>

  <!-- стена: три плиты с проломом посередине -->
  <g fill="#ffffff" fill-opacity="0.16">
    <rect x="452" y="236" width="120" height="196" rx="28"/>
    <rect x="452" y="592" width="120" height="196" rx="28"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.07">
    <rect x="300" y="300" width="88" height="140" rx="24"/>
    <rect x="300" y="584" width="88" height="140" rx="24"/>
    <rect x="636" y="300" width="88" height="140" rx="24"/>
    <rect x="636" y="584" width="88" height="140" rx="24"/>
  </g>

  <!-- луч сквозь пролом -->
  <g filter="url(#glow)" fill="none" stroke="url(#beam)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M220 512 H770" stroke-width="72"/>
    <path d="M648 392 L780 512 L648 632" stroke-width="72"/>
  </g>
</svg>
